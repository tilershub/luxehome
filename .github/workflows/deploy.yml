name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Build & lint (runs on every push and PR) ──────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build Astro site
        env:
          # These are browser-public values, not privileged credentials. Keep the
          # deploy pinned to the LUXEhome project so stale repository secrets
          # cannot silently build the CMS against another Supabase project.
          PUBLIC_SUPABASE_URL: https://ctxugrhuanygycjgijcf.supabase.co
          PUBLIC_SUPABASE_ANON_KEY: sb_publishable_LajOmiaWyVdyJ-eGuoh-bw_72GlSpPs
        run: npm run build

      - name: Verify complete public and admin route output
        run: npm run verify:routes

      - name: Upload dist artefact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1
